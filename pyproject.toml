[project]
name = "qqagent"
version = "0.1.0"
description = "QQ 群聊机器人 - NoneBot2 + Lagrange.OneBot"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-apscheduler>=0.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = [
    "plugins.admin",
    "plugins.ai_chat",
    "plugins.commands",
    "plugins.group_manage",
    "plugins.scheduler",
]
plugin_dirs = []
