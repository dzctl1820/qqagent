services:
  # ===== NapCat 协议端 =====
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qqagent-napcat
    restart: always
    environment:
      - NAPCAT_UID=0
      - NAPCAT_GID=0
      - ACCOUNT=3381615312
    ports:
      - "3001:3001"
      - "6099:6099"
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/data:/app/.config/QQ
    networks:
      - bot-net

  # ===== NoneBot2 机器人 =====
  bot:
    build: .
    container_name: qqagent-bot
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - napcat
    networks:
      - bot-net

networks:
  bot-net:
    driver: bridge
