services:
  # ===== Lagrange.OneBot 协议端 =====
  lagrange:
    image: ghcr.io/lagrangedev/lagrange.onebot:edge
    container_name: qqagent-lagrange
    restart: always
    volumes:
      - ./lagrange/config:/app/config
      - ./lagrange/data:/app/data
    networks:
      - bot-net

  # ===== NoneBot2 机器人 =====
  bot:
    build: .
    container_name: qqagent-bot
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - lagrange
    networks:
      - bot-net

networks:
  bot-net:
    driver: bridge
