services:
  # ===== QQ 机器人 =====
  bot:
    build: .
    container_name: qqagent-bot
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - napcat
    networks:
      - bot-net

  # ===== NapCat (OneBot 协议适配) =====
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qqagent-napcat
    restart: always
    ports:
      - "3000:3000"   # WebUI 扫码登录
      - "6099:6099"   # NapCat WebUI 管理
    volumes:
      - napcat-config:/app/napcat/config
      - napcat-data:/app/.config/QQ
    networks:
      - bot-net

volumes:
  napcat-config:
  napcat-data:

networks:
  bot-net:
    driver: bridge
